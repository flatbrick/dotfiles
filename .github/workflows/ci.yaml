name: ci

on:
  push:
  pull_request:

jobs:
  clone-and-install:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/vscode/devcontainers/base:ubuntu
      env:
        CODESPACES: true
    steps:
      - uses: actions/checkout@v2
      - name: Check README tree alignment
        run: ./scripts/readme-tree.sh --check
      - run: ./install.sh
      - name: Verify home source root
        run: test "$("$HOME/.local/bin/chezmoi" source-path)" = "$(pwd -P)/home"
      - name: chezmoi data
        run: '"$HOME/.local/bin/chezmoi" data'
